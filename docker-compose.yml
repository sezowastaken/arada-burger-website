services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      # Overrides the host-oriented DATABASE_URL from .env — inside the
      # compose network the database is reachable at `postgres`, not
      # `localhost`.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the browser bundle at build time — used by /admin to
        # call the backend. See frontend/.env.example.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    restart: unless-stopped
    env_file: .env
    environment:
      # .env's PORT is the backend's port (4000); override it here so the
      # frontend's own Next.js server doesn't pick it up and collide with
      # the 3000:3000 port mapping below.
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
